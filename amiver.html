<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 2nd Month! 🌻</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Mali', cursive;
      background: repeating-linear-gradient(-45deg, #eef7fc, #eef7fc 30px, #ffffff 30px, #ffffff 60px);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
      overflow-x: hidden;
      position: relative;
    }

    /* Overlay หน้าแรกเปิดการ์ด */
    .start-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.96);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: opacity 0.5s ease;
    }
    .start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .start-card-btn {
      background: #ff7675;
      color: white;
      font-family: 'Mali', cursive;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 16px 36px;
      border: none;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(255, 118, 117, 0.4);
      animation: pulse 1.5s infinite;
      cursor: pointer;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Floating Petals */
    .petal {
      position: fixed;
      background-color: #ffd700;
      border-radius: 15px 0px 15px 0px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    /* Main Container */
    .main-container {
      background: #fffdf9;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 3px solid #fff;
      padding: 25px 20px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-banner {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ff9f43;
      text-align: center;
      margin-bottom: 15px;
    }

    .flower-box {
      width: 100%;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }
    .flower-box svg { max-width: 100%; max-height: 100%; }

    /* Letter Card */
    .letter-card {
      background: #ffffff;
      border: 2px solid #2d3436;
      border-radius: 4px;
      width: 100%;
      padding: 20px;
      box-shadow: 4px 4px 0px #2d3436;
      font-family: 'Courier Prime', monospace;
      color: #2d3436;
    }
    .salutation { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
    .body-text { font-size: 0.95rem; line-height: 1.6; min-height: 80px; white-space: pre-wrap; margin-bottom: 15px; }
    .valediction { font-weight: 700; text-align: right; }
    .sign-off { text-align: right; font-size: 0.95rem; margin-top: 4px; }

    /* Music Player Bar */
    .music-player-bar {
      width: 100%;
      background: #fff0f3;
      border-radius: 12px;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      border: 1px solid #ffccd5;
    }
    .song-info { display: flex; align-items: center; gap: 10px; }
    .vinyl-icon {
      width: 32px; height: 32px;
      background: #2d3436; border-radius: 50%;
      border: 2px solid #ff7675;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 10px;
      animation: spin 4s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .song-title { font-size: 0.85rem; font-weight: 600; color: #d63031; }

    /* Frame YouTube */
    #player-container {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Overlay หน้าแรก -->
  <div class="start-overlay" id="startOverlay" onclick="startCardAndMusic()">
    <div style="font-size: 3rem; margin-bottom: 15px;">🌻✨</div>
    <button class="start-card-btn">กดเพื่อเปิดการ์ด 💕</button>
  </div>

  <div class="main-container">
    <div class="title-banner">Happy 2nd Month! 🌻</div>

    <div class="flower-box">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <path d="M 90,170 C 50,150 40,210 110,210 Z" fill="#4b6584" />
        <path d="M 210,170 C 250,150 260,210 190,210 Z" fill="#4b6584" />
        <path d="M 80,120 C 30,100 30,160 90,160 Z" fill="#26de81" />
        <path d="M 220,120 C 270,100 270,160 210,160 Z" fill="#26de81" />
        <path d="M 135,160 L 125,260 M 150,160 L 150,270 M 165,160 L 175,260" stroke="#20bf6b" stroke-width="8" stroke-linecap="round"/>
        <g transform="translate(100, 110)">
          <g fill="#ffa801">
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(0)" />
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(30)" />
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(60)" />
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(90)" />
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(120)" />
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(150)" />
          </g>
          <circle cx="0" cy="0" r="18" fill="#574b90"/><circle cx="0" cy="0" r="15" fill="#3d3d3d"/>
        </g>
        <g transform="translate(200, 110)">
          <g fill="#ffa801">
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(15)" />
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(45)" />
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(75)" />
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(105)" />
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(135)" />
            <ellipse cx="0" cy="0" rx="40" ry="10" transform="rotate(165)" />
          </g>
          <circle cx="0" cy="0" r="18" fill="#574b90"/><circle cx="0" cy="0" r="15" fill="#3d3d3d"/>
        </g>
        <g transform="translate(150, 75)">
          <g fill="#ffc048">
            <ellipse cx="0" cy="0" rx="48" ry="12" transform="rotate(0)" />
            <ellipse cx="0" cy="0" rx="48" ry="12" transform="rotate(20)" />
            <ellipse cx="0" cy="0" rx="48" ry="12" transform="rotate(40)" />
            <ellipse cx="0" cy="0" rx="48" ry="12" transform="rotate(60)" />
            <ellipse cx="0" cy="0" rx="48" ry="12" transform="rotate(80)" />
            <ellipse cx="0" cy="0" rx="48" ry="12" transform="rotate(100)" />
            <ellipse cx="0" cy="0" rx="48" ry="12" transform="rotate(120)" />
            <ellipse cx="0" cy="0" rx="48" ry="12" transform="rotate(140)" />
            <ellipse cx="0" cy="0" rx="48" ry="12" transform="rotate(160)" />
          </g>
          <circle cx="0" cy="0" r="22" fill="#485460"/><circle cx="0" cy="0" r="18" fill="#1e272e"/>
        </g>
        <path d="M 120,220 Q 150,230 180,220 Q 160,250 180,280 L 150,240 L 120,280 Q 140,250 120,220 Z" fill="#ff7675"/>
        <circle cx="150" cy="225" r="8" fill="#d63031"/>
      </svg>
    </div>

    <div class="letter-card">
      <div class="salutation">Dear พี่ปลื้ม,</div>
      <div class="body-text">2เดือนละไวจัง ขอโทษที่บางวันไม่น่ารัก เค้ารักพี่ปลื้มที่สุด มาต่อสัญญาค่ะ 💕</div>
      <div class="valediction">Sincerely,</div>
      <div class="sign-off">คีมมมมมม</div>
    </div>

    <div class="music-player-bar">
      <div class="song-info">
        <div class="vinyl-icon">🎵</div>
        <div>
          <div class="song-title">oasis - Atom / D Gerrard</div>
          <div style="font-size: 0.7rem; color: #636e72;">Playing Youtube Music...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="player-container"></div>

  <script>
    function startCardAndMusic() {
      document.getElementById('startOverlay').classList.add('hidden');
      const container = document.getElementById('player-container');
      container.innerHTML = `<iframe width="560" height="315" src="https://www.youtube.com/embed/rPZIiRQNXjk?autoplay=1&loop=1&playlist=rPZIiRQNXjk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    }

    function createPetals() {
      for (let i = 0; i < 12; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
        petal.style.animationDelay = (Math.random() * 5) + 's';
        petal.style.width = (Math.random() * 8 + 10) + 'px';
        petal.style.height = (Math.random() * 8 + 10) + 'px';
        document.body.appendChild(petal);
      }
    }
    createPetals();
  </script>
</body>
</html>
